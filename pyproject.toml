[project]
name = "fleet-telematics"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "sqlalchemy>=2.1.1",
    "xgboost>=3.4.1",
    "scipy>=1.16",
]

[project.scripts]
fleet = "src:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
